name: ClaudeUsage
options:
  bundleIdPrefix: com.lisixuan
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: 7C52KNT3ZW
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Claude 用量
    entitlements:
      path: App/ClaudeUsage.entitlements
      properties:
        com.apple.security.application-groups: [7C52KNT3ZW.com.lisixuan.ClaudeUsage]
    dependencies:
      - target: ClaudeUsageWidget
  ClaudeUsageWidget:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lisixuan.ClaudeUsage.Widget
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Claude 用量
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ClaudeUsageWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [7C52KNT3ZW.com.lisixuan.ClaudeUsage]
